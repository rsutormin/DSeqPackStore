[package]
name = "dseqpackstore"
version = "0.1.1"
edition = "2021"
license = "MIT"

[dependencies]
ahash = "0.8"
anyhow = "1.0"
bincode = "1.3"
flate2 = "1.0"
rayon = "1.8"
rdst = "0.20"
serde = { version = "1.0", features = ["derive"] }
